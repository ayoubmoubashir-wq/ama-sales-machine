<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMA Automations — Sales Machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --black: #060606;
    --teal: #08f7f7;
    --teal-dim: rgba(8,247,247,0.12);
    --teal-mid: rgba(8,247,247,0.4);
    --white: #f0f0f0;
    --grey: #1a1a1a;
    --grey2: #2a2a2a;
    --text-muted: #777;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* HEADER */
  header {
    width: 100%;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--grey2);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--teal);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* HERO */
  .hero {
    text-align: center;
    padding: 48px 24px 32px;
    max-width: 560px;
  }

  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .hero h1 {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 14px;
  }

  .hero h1 span {
    color: var(--teal);
  }

  .hero p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* CHAT */
  .chat-container {
    width: 100%;
    max-width: 620px;
    padding: 0 16px 120px;
    flex: 1;
  }

  .messages {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 16px;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--teal-dim);
    border: 1px solid var(--teal-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    color: var(--teal);
    font-size: 11px;
  }

  .msg.user .avatar {
    background: var(--grey2);
    border-color: #444;
    color: var(--white);
  }

  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.bot .bubble {
    background: var(--grey);
    border: 1px solid var(--grey2);
    border-top-left-radius: 4px;
    color: var(--white);
  }

  .msg.user .bubble {
    background: var(--teal-dim);
    border: 1px solid var(--teal-mid);
    border-top-right-radius: 4px;
    color: var(--teal);
    text-align: right;
  }

  /* TYPING */
  .typing .bubble {
    padding: 14px 18px;
  }

  .typing-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--teal);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* INPUT */
  .input-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px;
    background: linear-gradient(to top, var(--black) 70%, transparent);
    display: flex;
    justify-content: center;
  }

  .input-wrap {
    width: 100%;
    max-width: 620px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--grey);
    border: 1px solid var(--grey2);
    border-radius: 16px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--teal-mid);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
  }

  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--teal);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }

  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { opacity: 0.85; }

  .send-btn svg { color: var(--black); }

  /* LEAD CARD */
  .lead-card {
    background: var(--grey);
    border: 1px solid var(--teal-mid);
    border-radius: 16px;
    padding: 20px;
    margin-top: 8px;
  }

  .lead-card h3 {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .lead-card p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .lead-card p strong { color: var(--white); }

  .cta-btn {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 20px;
    background: var(--teal);
    color: var(--black);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    text-decoration: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">AMA // Automations</div>
  <div class="status-dot">
    <div class="dot"></div>
    Machine Online
  </div>
</header>

<div class="hero">
  <div class="hero-label">Intelligent Sales Machine</div>
  <h1>Find your perfect <span>automation</span> in 2 minutes</h1>
  <p>Tell us about your business and we'll recommend the exact machine you need — no tech knowledge required.</p>
</div>

<div class="chat-container">
  <div class="messages" id="messages"></div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Type your message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are AMA, the intelligent sales assistant for AMA Automations — a company that builds custom automation machines for businesses worldwide. You speak in a friendly, confident, and professional tone.

PHASE 1 — GENERAL QUALIFICATION (ask these one at a time):
1. Greet warmly and ask their name
2. Ask what country they're in and what type of business they run
3. Ask what's their biggest daily problem / what wastes most of their time
4. Ask roughly how many customers they deal with per day
5. Based on answers, identify which machine fits them best:
   - 📦 Order Taking Machine → product sellers, perfume, fashion, food
   - 🏠 Lead Manager Machine → real estate, cars, land, property
   - 🤖 Customer Support Machine → any business with many inquiries
   - 📅 Appointment Machine → clinics, salons, consultants, lawyers
   - 📢 Follow-Up Machine → businesses losing leads to silence
   - 🛒 eCommerce Machine → online stores needing full automation

PHASE 2 — DEEP QUALIFICATION (ask specific questions based on their machine):

If ORDER TAKING MACHINE:
- What products do you sell exactly?
- How do customers order now? (WhatsApp, Instagram DM, website?)
- Do you need payment collection or just order capture?
- Do you have a price list or catalogue?

If LEAD MANAGER MACHINE:
- What exactly are you selling? (apartments, land, commercial?)
- How many inquiries do you get per day?
- Do you currently use any CRM or spreadsheet to track leads?
- What's your biggest problem — too many leads, slow follow-up, or lost contacts?

If CUSTOMER SUPPORT MACHINE:
- What are the most common questions your customers ask?
- Do you sell products or services?
- Do you need the machine to handle complaints or just answer questions?
- What platform do customers contact you on? (WhatsApp, Instagram, website?)

If APPOINTMENT MACHINE:
- What service do you offer?
- How many bookings do you take per day?
- Do you currently use any booking system?
- Do you need reminders sent to customers before their appointment?

If FOLLOW-UP MACHINE:
- What do you sell or offer?
- How many leads go cold without buying every week?
- How do you currently follow up? (manually on WhatsApp?)
- How long after first contact do leads usually go silent?

If ECOMMERCE MACHINE:
- What platform is your store on? (Shopify, WooCommerce, Instagram?)
- What do you need automated? (orders, delivery updates, abandoned cart?)
- Do you have multiple product variants or a simple catalogue?

PHASE 3 — CLOSE:
- Tell them exactly what their recommended machine will do for their specific business in 2 sentences
- Ask for their WhatsApp number
- Tell them the AMA team will reach out within 24 hours to discuss setup and pricing

IMPORTANT RULES:
- NEVER call them "bots" — always say "machine" or "automation machine"
- Detect the language/tone they use and mirror it naturally (English, Pidgin, French, Arabic, Yoruba, Hausa — anything)
- Keep responses SHORT — max 3 sentences per reply
- Ask ONE question at a time, never multiple
- Be warm, human, and conversational — not robotic or salesy
- Only output LEAD_DATA when you have collected: name, whatsapp, country, business type, machine type, AND all the deep qualification answers for their specific machine
- Output LEAD_DATA at the very END of your final message in this exact format:
  LEAD_DATA:{"name":"...","whatsapp":"...","business":"...","country":"...","daily_customers":"...","recommended_machine":"...","specific_needs":"...","current_process":"...","platform":"..."}`;


let conversationHistory = [];
let leadCollected = false;

async function callClaude(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });

  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer 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",
      "HTTP-Referer": "https://ayoubmoubashir-wq.github.io",
      "X-Title": "AMA Sales Machine"
    },
    body: JSON.stringify({
      model: "meta-llama/llama-3.3-70b-instruct:free",
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        ...conversationHistory
      ]
    })
  });

  const data = await response.json();
  const fullText = data.choices[0].message.content;

  // Extract lead data if present
  let displayText = fullText;
  let leadData = null;

  if (fullText.includes("LEAD_DATA:")) {
    const parts = fullText.split("LEAD_DATA:");
    displayText = parts[0].trim();
    try {
      leadData = JSON.parse(parts[1].trim());
    } catch(e) {}
  }

  conversationHistory.push({ role: "assistant", content: fullText });
  return { text: displayText, leadData };
}

function addMessage(text, role, leadData = null) {
  const messages = document.getElementById("messages");

  const msg = document.createElement("div");
  msg.className = `msg ${role}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "bot" ? "AM" : "You";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = text.replace(/\n/g, "<br>");

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messages.appendChild(msg);

  // Show lead card if we have lead data
  if (leadData && !leadCollected) {
    leadCollected = true;
    setTimeout(() => showLeadCard(leadData), 500);
  }

  messages.scrollTop = messages.scrollHeight;
}

function showLeadCard(data) {
  const messages = document.getElementById("messages");

  const card = document.createElement("div");
  card.className = "lead-card";
  card.innerHTML = `
    <h3>✅ Lead Captured</h3>
    <p><strong>${data.name}</strong> — ${data.business} (${data.country})</p>
    <p>📱 WhatsApp: <strong>${data.whatsapp}</strong></p>
    <p>🎯 Recommended: <strong>${data.recommended_machine}</strong></p>
    <a class="cta-btn" href="https://wa.me/2348111387966?text=Hi%20AMA%2C%20I%20just%20used%20your%20Sales%20Machine%20and%20I%27m%20interested%20in%20the%20${encodeURIComponent(data.recommended_machine)}" target="_blank">
      → Chat with AMA Team
    </a>
  `;

  const msg = document.createElement("div");
  msg.className = "msg bot";
  msg.style.animation = "fadeUp 0.3s ease";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "AM";

  msg.appendChild(avatar);
  msg.appendChild(card);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

function showTyping() {
  const messages = document.getElementById("messages");
  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.id = "typing";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "AM";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  typing.appendChild(avatar);
  typing.appendChild(bubble);
  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.style.height = "auto";
  document.getElementById("sendBtn").disabled = true;

  addMessage(text, "user");
  showTyping();

  try {
    const { text: reply, leadData } = await callClaude(text);
    removeTyping();
    addMessage(reply, "bot", leadData);
  } catch(e) {
    removeTyping();
    addMessage("Sorry, something went wrong. Please try again.", "bot");
  }

  document.getElementById("sendBtn").disabled = false;
  input.focus();
}

// Auto-resize textarea
document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// Enter to send
document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Start conversation
window.addEventListener("load", async () => {
  showTyping();
  try {
    const { text } = await callClaude("start");
    removeTyping();
    addMessage(text, "bot");
  } catch(e) {
    removeTyping();
    addMessage("👋 Welcome to AMA Automations! I'm AMA, your automation advisor. What business do you run?", "bot");
  }
});
</script>
</body>
</html>
