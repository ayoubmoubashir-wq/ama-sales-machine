<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMA Automations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap');

:root {
  --bg: #080810;
  --surface: #0e0e1a;
  --card: #13131f;
  --border: #1e1e32;
  --teal: #00f5d4;
  --purple: #7b5ea7;
  --blue: #4361ee;
  --text: #e8e8f0;
  --muted: #5a5a7a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* 3D CANVAS */
#heroCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

/* GRID OVERLAY */
.grid-overlay {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,245,212,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,212,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* GLOW ORBS */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: orbFloat 8s ease-in-out infinite;
}
.orb1 { width:300px; height:300px; background:rgba(0,245,212,0.07); top:-100px; right:-50px; animation-delay:0s; }
.orb2 { width:250px; height:250px; background:rgba(123,94,167,0.08); bottom:-80px; left:-60px; animation-delay:-4s; }
.orb3 { width:200px; height:200px; background:rgba(67,97,238,0.06); top:40%; left:50%; animation-delay:-2s; }

@keyframes orbFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(20px,-30px) scale(1.05); }
  66% { transform: translate(-15px,20px) scale(0.95); }
}

/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: rgba(8,8,16,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.agent-orb {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: var(--bg);
  position: relative;
  box-shadow: 0 0 20px rgba(0,245,212,0.3);
}

.pulse-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,245,212,0.4);
  animation: pulseRing 2s ease-out infinite;
}

@keyframes pulseRing {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.5); opacity: 0; }
}

.agent-info h2 { font-size: 14px; font-weight: 600; color: var(--text); }
.agent-info p { font-size: 11px; color: var(--teal); margin-top: 1px; }

/* CHAT */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px 140px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.date-label {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 8px 0 4px;
  letter-spacing: 0.05em;
}

/* MSG */
.msg-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  animation: msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes msgIn {
  from { opacity:0; transform:translateY(12px) scale(0.96); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.msg-row.user { flex-direction: row-reverse; }

.m-av {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--bg);
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(0,245,212,0.2);
}

.msg-row.user .m-av {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  box-shadow: none;
}

.bubble {
  max-width: 75%;
  padding: 11px 15px;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
}

.msg-row.bot .bubble {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px 18px 18px 4px;
  color: var(--text);
}

.msg-row.user .bubble {
  background: linear-gradient(135deg, var(--teal), #00c4ab);
  border-radius: 18px 18px 4px 18px;
  color: var(--bg);
  font-weight: 500;
}

.msg-time {
  font-size: 10px;
  color: var(--muted);
  padding: 0 6px;
  margin-top: 1px;
}
.msg-row.user + .msg-time { text-align: right; }

/* TYPING */
.typing-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.typing-bub {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px 18px 18px 4px;
  padding: 13px 18px;
  display: flex;
  gap: 5px;
  align-items: center;
}

.typing-bub span {
  width: 6px; height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: tdot 1.4s infinite;
}
.typing-bub span:nth-child(2) { animation-delay: 0.2s; }
.typing-bub span:nth-child(3) { animation-delay: 0.4s; }

@keyframes tdot {
  0%,60%,100% { transform:translateY(0); background:var(--muted); }
  30% { transform:translateY(-7px); background:var(--teal); }
}

/* LEAD CARD */
.lead-card {
  background: linear-gradient(135deg, rgba(0,245,212,0.05), rgba(67,97,238,0.05));
  border: 1px solid rgba(0,245,212,0.25);
  border-radius: 16px;
  padding: 16px;
  max-width: 75%;
  position: relative;
  overflow: hidden;
}

.lead-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--teal), var(--blue), var(--purple));
}

.lead-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.lead-info {
  font-size: 13px;
  color: #8888aa;
  margin-bottom: 5px;
  line-height: 1.5;
}
.lead-info strong { color: var(--text); }

.wa-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  background: #25D366;
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  padding: 9px 16px;
  border-radius: 10px;
  text-decoration: none;
  transition: opacity 0.2s;
}
.wa-btn:hover { opacity: 0.9; }

/* INPUT */
.input-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(8,8,16,0.9);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

textarea {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px 16px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  resize: none;
  max-height: 100px;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus {
  border-color: rgba(0,245,212,0.4);
  box-shadow: 0 0 0 3px rgba(0,245,212,0.06);
}
textarea::placeholder { color: var(--muted); }

.send-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--blue));
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(0,245,212,0.3);
  transition: transform 0.15s, box-shadow 0.2s;
}
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>

<canvas id="heroCanvas"></canvas>
<div class="grid-overlay"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="topbar">
  <div class="agent-orb">
    A
    <div class="pulse-ring"></div>
  </div>
  <div class="agent-info">
    <h2>Ayinde — AMA Automations</h2>
    <p>⬤ Online now</p>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="date-label">Today</div>
</div>

<div class="input-bar">
  <textarea id="userInput" placeholder="Message Ayinde..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#080810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
/* ── 3D PARTICLE CANVAS ── */
const canvas = document.getElementById('heroCanvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], nodes = [], connections = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Particles
for(let i=0; i<60; i++) {
  particles.push({
    x: Math.random()*100,
    y: Math.random()*100,
    z: Math.random()*100,
    vx: (Math.random()-0.5)*0.08,
    vy: (Math.random()-0.5)*0.08,
    vz: (Math.random()-0.5)*0.05,
    r: Math.random()*1.5+0.5
  });
}

// Nodes (3D circuit nodes)
for(let i=0; i<20; i++) {
  nodes.push({
    x: Math.random()*80+10,
    y: Math.random()*80+10,
    z: Math.random()*60+20,
    pulse: Math.random()*Math.PI*2,
    speed: Math.random()*0.02+0.01
  });
}

let angle = 0;

function project(x, y, z) {
  const fov = 200;
  const scale = fov / (fov + z);
  return {
    x: (x - 50) * scale * (W/100) + W/2,
    y: (y - 50) * scale * (H/100) + H/2,
    scale
  };
}

function drawScene() {
  ctx.clearRect(0,0,W,H);
  angle += 0.002;

  // Draw connections between close nodes
  for(let i=0; i<nodes.length; i++) {
    for(let j=i+1; j<nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dist = Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2);
      if(dist < 30) {
        const pa = project(a.x, a.y, a.z + Math.sin(angle)*5);
        const pb = project(b.x, b.y, b.z + Math.sin(angle)*5);
        const alpha = (1 - dist/30) * 0.15;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.strokeStyle = `rgba(0,245,212,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // Draw nodes
  nodes.forEach(n => {
    n.pulse += n.speed;
    const rx = n.x + Math.sin(angle*0.7)*3;
    const ry = n.y + Math.cos(angle*0.5)*3;
    const rz = n.z + Math.sin(angle)*8;
    const p = project(rx, ry, rz);
    const pulse = (Math.sin(n.pulse)+1)/2;
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.scale*3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,245,212,${0.1+pulse*0.2})`;
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.scale*1.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,245,212,${0.4+pulse*0.3})`;
    ctx.fill();
  });

  // Draw particles
  particles.forEach(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.z += pt.vz;
    if(pt.x<0||pt.x>100) pt.vx*=-1;
    if(pt.y<0||pt.y>100) pt.vy*=-1;
    if(pt.z<0||pt.z>100) pt.vz*=-1;
    const p = project(pt.x, pt.y, pt.z);
    ctx.beginPath();
    ctx.arc(p.x, p.y, pt.r*p.scale, 0, Math.PI*2);
    ctx.fillStyle = `rgba(123,94,167,${0.3*p.scale})`;
    ctx.fill();
  });

  requestAnimationFrame(drawScene);
}
drawScene();

/* ── CHAT LOGIC ── */
const SYSTEM_PROMPT = `You are Ayinde, a friendly human consultant at AMA Automations. You help business owners figure out the best automation solution for their business. You are NOT an AI — you are a real person having a genuine conversation. Be warm, casual, and human. Use natural language, occasional "hmm", "gotcha", "nice!", "that's interesting" etc. Never reveal you are AI.

PHASE 1 — GET TO KNOW THEM (one question at a time, casually):
1. Greet warmly and ask their name
2. Ask what country they're in and what type of business they run
3. Ask what their biggest daily headache is / what wastes most of their time
4. Ask roughly how many customers they deal with per day
5. Based on answers, figure out which automation fits:
   - Order Taking Machine: product sellers, perfume, fashion, food
   - Lead Manager Machine: real estate, cars, land, property
   - Customer Support Machine: high-inquiry businesses
   - Appointment Machine: clinics, salons, consultants, lawyers
   - Follow-Up Machine: businesses losing cold leads
   - eCommerce Machine: online stores needing full automation

PHASE 2 — DIG DEEPER (based on which automation fits, ask these casually):

Order Taking: What products exactly? How do customers order now? Need payment collection? Got a price list?
Lead Manager: What are you selling exactly? How many inquiries per day? Tracking leads anywhere? Biggest pain?
Customer Support: Most common questions? Products or services? Just Q&A or complaints too? Which platform?
Appointment: What service? Bookings per day? Current booking system? Want reminders sent to clients?
Follow-Up: What do you sell? Leads going cold weekly? How do you follow up now? When do leads go silent?
eCommerce: Which platform? What needs automating? Simple or big catalogue?

PHASE 3 — CLOSE NATURALLY:
Tell them casually how the automation fixes their specific problem. Ask for their WhatsApp number. Tell them you'll have someone reach out within 24 hours.

RULES:
- NEVER say "bot", "AI", "machine learning" — you are HUMAN
- Detect their language and respond naturally in it
- Max 2-3 sentences per reply
- ONE question at a time
- Sound like a real WhatsApp chat — casual, warm, genuine
- Only output LEAD_DATA when you have ALL info: name, whatsapp, country, business, automation type, deep answers
- Put at very end: LEAD_DATA:{"name":"...","whatsapp":"...","business":"...","country":"...","daily_customers":"...","recommended_machine":"...","specific_needs":"...","current_process":"...","platform":"..."}`;

let history = [], leadDone = false;

function getTime() {
  return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

async function callAI(msg) {
  history.push({role:"user",content:msg});
  const gemHistory = history.slice(0,-1).map(m=>({
    role: m.role==="assistant"?"model":"user",
    parts:[{text:m.content}]
  }));
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AQ.Ab8RN6LUaezkNSk2g0jMXsAKedWlnUbi2T4Cj011OAHjRWON6w",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      system_instruction:{parts:[{text:SYSTEM_PROMPT}]},
      contents:[...gemHistory,{role:"user",parts:[{text:msg}]}]
    })
  });
  const data = await res.json();
  if(!data.candidates) throw new Error(JSON.stringify(data));
  const full = data.candidates[0].content.parts[0].text;
  history.push({role:"assistant",content:full});
  let text=full, lead=null;
  if(full.includes("LEAD_DATA:")){
    const p=full.split("LEAD_DATA:");
    text=p[0].trim();
    try{lead=JSON.parse(p[1].trim())}catch(e){}
  }
  if(lead){
    const tmsg=`🔥 NEW AMA LEAD!\n\n👤 Name: ${lead.name}\n📱 WhatsApp: ${lead.whatsapp}\n🌍 Country: ${lead.country}\n💼 Business: ${lead.business}\n👥 Daily Customers: ${lead.daily_customers}\n\n🎯 Recommended: ${lead.recommended_machine}\n📋 Needs: ${lead.specific_needs}\n⚙️ Current Process: ${lead.current_process}\n📲 Platform: ${lead.platform}`;
    fetch(`https://api.telegram.org/bot8263543258:AAHuIaYH0asWQwY7_Bk-tEKP6e2LnvZxF6U/sendMessage`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:"5780155144",text:tmsg})
    });
  }
  return {text,lead};
}

function addBotMsg(text,lead=null){
  const area=document.getElementById("chatArea");
  const wrap=document.createElement("div");wrap.className="msg-wrap";
  const row=document.createElement("div");row.className="msg-row bot";
  const av=document.createElement("div");av.className="m-av";av.textContent="A";
  const bub=document.createElement("div");bub.className="bubble";
  bub.innerHTML=text.replace(/\n/g,"<br>");
  row.appendChild(av);row.appendChild(bub);
  const time=document.createElement("div");time.className="msg-time";time.textContent=getTime();
  wrap.appendChild(row);wrap.appendChild(time);
  area.appendChild(wrap);
  if(lead&&!leadDone){leadDone=true;setTimeout(()=>showCard(lead),400);}
  area.scrollTop=area.scrollHeight;
}

function addUserMsg(text){
  const area=document.getElementById("chatArea");
  const wrap=document.createElement("div");wrap.className="msg-wrap";
  const row=document.createElement("div");row.className="msg-row user";
  const av=document.createElement("div");av.className="m-av";av.textContent="Y";
  const bub=document.createElement("div");bub.className="bubble";bub.textContent=text;
  row.appendChild(av);row.appendChild(bub);
  const time=document.createElement("div");time.className="msg-time";time.textContent=getTime();
  wrap.appendChild(row);wrap.appendChild(time);
  area.appendChild(wrap);
  area.scrollTop=area.scrollHeight;
}

function showTyping(){
  const area=document.getElementById("chatArea");
  const wrap=document.createElement("div");wrap.className="msg-wrap";wrap.id="typingWrap";
  const row=document.createElement("div");row.className="typing-row";
  const av=document.createElement("div");av.className="m-av";av.textContent="A";
  const bub=document.createElement("div");bub.className="typing-bub";
  bub.innerHTML="<span></span><span></span><span></span>";
  row.appendChild(av);row.appendChild(bub);
  wrap.appendChild(row);area.appendChild(wrap);
  area.scrollTop=area.scrollHeight;
}

function removeTyping(){const t=document.getElementById("typingWrap");if(t)t.remove();}

function showCard(d){
  const area=document.getElementById("chatArea");
  const wrap=document.createElement("div");wrap.className="msg-wrap";
  const row=document.createElement("div");row.className="msg-row bot";
  const av=document.createElement("div");av.className="m-av";av.textContent="A";
  const card=document.createElement("div");card.className="lead-card";
  card.innerHTML=`<div class="lead-tag">✅ Details saved</div>
    <div class="lead-info"><strong>${d.name}</strong> · ${d.business}</div>
    <div class="lead-info">📍 ${d.country} &nbsp;·&nbsp; 📱 ${d.whatsapp}</div>
    <div class="lead-info">🎯 <strong>${d.recommended_machine}</strong></div>
    <a class="wa-btn" href="https://wa.me/2348111387966?text=Hi+Ayinde,+I+just+used+the+AMA+site.+I+need+the+${encodeURIComponent(d.recommended_machine)}" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.112 1.527 5.836L.057 23.286a.75.75 0 00.914.914l5.45-1.47A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.933 0-3.741-.524-5.29-1.434l-.381-.224-3.934 1.062 1.062-3.933-.224-.381A9.95 9.95 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      Chat on WhatsApp
    </a>`;
  row.appendChild(av);row.appendChild(card);
  wrap.appendChild(row);area.appendChild(wrap);
  area.scrollTop=area.scrollHeight;
}

async function sendMessage(){
  const inp=document.getElementById("userInput");
  const text=inp.value.trim();
  if(!text)return;
  inp.value="";inp.style.height="auto";
  document.getElementById("sendBtn").disabled=true;
  addUserMsg(text);showTyping();
  try{
    const {text:reply,lead}=await callAI(text);
    removeTyping();addBotMsg(reply,lead);
  }catch(e){
    removeTyping();
    addBotMsg("Sorry, give me a sec and try again 🙏");
  }
  document.getElementById("sendBtn").disabled=false;
  inp.focus();
}

document.getElementById("userInput").addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,100)+"px";
});
document.getElementById("userInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});

window.addEventListener("load",async()=>{
  showTyping();
  try{
    const {text}=await callAI("start");
    removeTyping();addBotMsg(text);
  }catch(e){
    removeTyping();
    addBotMsg("Hey! 👋 Welcome to AMA Automations. I'm Ayinde. What kind of business do you run?");
  }
});
</script>
</body>
</html>
