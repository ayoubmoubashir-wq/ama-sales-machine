<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMA Automations — Sales Machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--black:#060606;--teal:#08f7f7;--teal-dim:rgba(8,247,247,0.12);--teal-mid:rgba(8,247,247,0.4);--white:#f0f0f0;--grey:#1a1a1a;--grey2:#2a2a2a;--muted:#777}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--grey2)}
  .logo{font-family:'Space Mono',monospace;font-size:13px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hero{text-align:center;padding:40px 24px 24px;max-width:560px}
  .hero-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:clamp(26px,6vw,40px);font-weight:700;line-height:1.1;margin-bottom:12px}
  .hero h1 span{color:var(--teal)}
  .hero p{font-size:14px;color:var(--muted);line-height:1.6}
  .chat-container{width:100%;max-width:620px;padding:0 16px 130px;flex:1}
  .messages{display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
  .msg{display:flex;gap:10px;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-dim);border:1px solid var(--teal-mid);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-family:'Space Mono',monospace;color:var(--teal)}
  .msg.user .avatar{background:var(--grey2);border-color:#444;color:var(--white)}
  .bubble{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6}
  .msg.bot .bubble{background:var(--grey);border:1px solid var(--grey2);border-top-left-radius:4px}
  .msg.user .bubble{background:var(--teal-dim);border:1px solid var(--teal-mid);border-top-right-radius:4px;color:var(--teal);text-align:right}
  .typing-dots{display:flex;gap:5px;align-items:center;padding:4px 0}
  .typing-dots span{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:bounce 1.2s infinite}
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
  .input-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,var(--black) 70%,transparent);display:flex;justify-content:center}
  .input-wrap{width:100%;max-width:620px;display:flex;gap:10px;align-items:flex-end;background:var(--grey);border:1px solid var(--grey2);border-radius:16px;padding:10px 14px;transition:border-color .2s}
  .input-wrap:focus-within{border-color:var(--teal-mid)}
  textarea{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:14px;resize:none;max-height:120px;line-height:1.5}
  textarea::placeholder{color:var(--muted)}
  .send-btn{width:36px;height:36px;border-radius:10px;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
  .send-btn:disabled{opacity:.3;cursor:not-allowed}
  .send-btn:not(:disabled):hover{opacity:.85}
  .lead-card{background:var(--grey);border:1px solid var(--teal-mid);border-radius:16px;padding:20px;margin-top:8px}
  .lead-card h3{font-family:'Space Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .lead-card p{font-size:13px;color:var(--muted);margin-bottom:6px}
  .lead-card p strong{color:var(--white)}
  .cta-btn{display:inline-block;margin-top:14px;padding:10px 20px;background:var(--teal);color:var(--black);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo">AMA // Automations</div>
  <div class="status"><div class="dot"></div>Machine Online</div>
</header>
<div class="hero">
  <div class="hero-label">Intelligent Sales Machine</div>
  <h1>Find your perfect <span>automation</span> in 2 minutes</h1>
  <p>Tell us about your business and we'll recommend the exact machine you need.</p>
</div>
<div class="chat-container">
  <div class="messages" id="messages"></div>
</div>
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Type your message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#060606" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>
<script>
const SYSTEM_PROMPT = `You are AMA, the intelligent sales assistant for AMA Automations — a company that builds custom automation machines for businesses worldwide. Friendly, confident, professional tone.

PHASE 1 — GENERAL QUALIFICATION (one question at a time):
1. Greet warmly, ask their name
2. Ask what country and type of business
3. Ask their biggest daily problem / what wastes most time
4. Ask roughly how many customers per day
5. Identify best machine:
   - Order Taking Machine: product sellers, perfume, fashion, food
   - Lead Manager Machine: real estate, cars, land
   - Customer Support Machine: high inquiry businesses
   - Appointment Machine: clinics, salons, consultants
   - Follow-Up Machine: businesses losing cold leads
   - eCommerce Machine: online stores

PHASE 2 — DEEP QUESTIONS based on machine identified:

Order Taking Machine: What products? How do customers order now? Need payment collection? Have a price list?
Lead Manager Machine: What are you selling? How many inquiries/day? Use CRM? Biggest problem — volume, follow-up, or lost contacts?
Customer Support Machine: Most common questions? Products or services? Handle complaints or just Q&A? Which platform — WhatsApp, Instagram, website?
Appointment Machine: What service? How many bookings/day? Current booking system? Need appointment reminders?
Follow-Up Machine: What do you sell? How many leads go cold weekly? How do you follow up now? When do leads go silent?
eCommerce Machine: Which platform — Shopify, WooCommerce, Instagram? What to automate — orders, delivery, abandoned cart? Simple or complex catalogue?

PHASE 3 — CLOSE:
Tell them in 2 sentences exactly what their machine will do for their specific business. Ask for WhatsApp number. Tell them AMA team contacts within 24hrs.

RULES:
- Never say "bot" — always say "machine" or "automation machine"
- Detect language/tone and mirror it (English, Pidgin, French, Arabic, Yoruba, Hausa, any language)
- Max 3 sentences per reply
- ONE question at a time only
- Be warm and human
- Only output LEAD_DATA when you have: name, whatsapp, country, business, machine type, AND all deep qualification answers
- Put LEAD_DATA at very end of final message:
LEAD_DATA:{"name":"...","whatsapp":"...","business":"...","country":"...","daily_customers":"...","recommended_machine":"...","specific_needs":"...","current_process":"...","platform":"..."}`;

let history = [];
let leadDone = false;

async function callAI(msg) {
  history.push({role:"user",content:msg});
  const geminiHistory = history.slice(0,-1).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AQ.Ab8RN6Ii6nqZeuzawJZljYDdI-9n4VP7tD01HfBMPCF8JLxFjA",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      system_instruction:{parts:[{text:SYSTEM_PROMPT}]},
      contents:[...geminiHistory,{role:"user",parts:[{text:msg}]}]
    })
  });
  const data = await res.json();
  if(!data.candidates) throw new Error(JSON.stringify(data));
  const full = data.candidates[0].content.parts[0].text;
  history.push({role:"assistant",content:full});
  let text=full, lead=null;
  if(full.includes("LEAD_DATA:")){
    const p=full.split("LEAD_DATA:");
    text=p[0].trim();
    try{lead=JSON.parse(p[1].trim())}catch(e){}
  }
  // Send to Telegram if lead captured
  if(lead){
    const msg = `🔥 NEW AMA LEAD!\n\n👤 Name: ${lead.name}\n📱 WhatsApp: ${lead.whatsapp}\n🌍 Country: ${lead.country}\n💼 Business: ${lead.business}\n👥 Daily Customers: ${lead.daily_customers}\n\n🎯 Recommended: ${lead.recommended_machine}\n📋 Needs: ${lead.specific_needs}\n⚙️ Current Process: ${lead.current_process}\n📲 Platform: ${lead.platform}`;
    fetch(`https://api.telegram.org/bot8263543258:AAHuIaYH0asWQwY7_Bk-tEKP6e2LnvZxF6U/sendMessage`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:"5780155144",text:msg})
    });
  }
  return {text,lead};
}

function addMsg(text,role,lead=null){
  const wrap=document.getElementById("messages");
  const msg=document.createElement("div");
  msg.className=`msg ${role}`;
  const av=document.createElement("div");
  av.className="avatar";
  av.textContent=role==="bot"?"AM":"You";
  const bub=document.createElement("div");
  bub.className="bubble";
  bub.innerHTML=text.replace(/\n/g,"<br>");
  msg.appendChild(av);
  msg.appendChild(bub);
  wrap.appendChild(msg);
  if(lead&&!leadDone){leadDone=true;setTimeout(()=>showCard(lead),400)}
  wrap.scrollTop=wrap.scrollHeight;
}

function showCard(d){
  const wrap=document.getElementById("messages");
  const msg=document.createElement("div");
  msg.className="msg bot";
  const av=document.createElement("div");
  av.className="avatar";
  av.textContent="AM";
  const card=document.createElement("div");
  card.className="lead-card";
  card.innerHTML=`<h3>✅ Lead Captured</h3>
    <p><strong>${d.name}</strong> — ${d.business} (${d.country})</p>
    <p>📱 <strong>${d.whatsapp}</strong></p>
    <p>🎯 <strong>${d.recommended_machine}</strong></p>
    <p>📋 ${d.specific_needs||''}</p>
    <a class="cta-btn" href="https://wa.me/2348111387966?text=Hi+AMA,+I+used+the+Sales+Machine.+I+need+the+${encodeURIComponent(d.recommended_machine)}" target="_blank">→ Chat with AMA Team</a>`;
  msg.appendChild(av);
  msg.appendChild(card);
  wrap.appendChild(msg);
  wrap.scrollTop=wrap.scrollHeight;
}

function showTyping(){
  const wrap=document.getElementById("messages");
  const t=document.createElement("div");
  t.className="msg bot";t.id="typing";
  const av=document.createElement("div");av.className="avatar";av.textContent="AM";
  const b=document.createElement("div");b.className="bubble";
  b.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  t.appendChild(av);t.appendChild(b);wrap.appendChild(t);
  wrap.scrollTop=wrap.scrollHeight;
}

function removeTyping(){const t=document.getElementById("typing");if(t)t.remove()}

async function sendMessage(){
  const inp=document.getElementById("userInput");
  const text=inp.value.trim();
  if(!text)return;
  inp.value="";inp.style.height="auto";
  document.getElementById("sendBtn").disabled=true;
  addMsg(text,"user");showTyping();
  try{
    const {text:reply,lead}=await callAI(text);
    removeTyping();addMsg(reply,"bot",lead);
  }catch(e){
    removeTyping();addMsg("Error: "+e.message,"bot");
  }
  document.getElementById("sendBtn").disabled=false;
  inp.focus();
}

document.getElementById("userInput").addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,120)+"px";
});
document.getElementById("userInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});

window.addEventListener("load",async()=>{
  showTyping();
  try{
    const {text}=await callAI("start");
    removeTyping();addMsg(text,"bot");
  }catch(e){
    removeTyping();
    addMsg("👋 Welcome to AMA Automations! I'm AMA, your automation advisor. What business do you run?","bot");
  }
});
</script>
</body>
</html>
